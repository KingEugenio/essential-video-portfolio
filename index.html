    <!-- Schema.org JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do we upload and transfer multi-terabyte raw project footage?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We provide dedicated high-speed cloud partitions via Google Drive, Frame.io, Dropbox Transfer, or Aspera. For extensive multi-camera shoots (500GB–8TB+), clients can ship encrypted physical NVMe/RAID hard drives directly to our editing studio suite for same-day local ingestion and verification."
          }
        },
        {
          "@type": "Question",
          "name": "Which raw camera formats, codecs, and color spaces do you support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We support all major professional digital cinema and broadcast pipelines including RED (R3D), ARRI (ARRIRAW/ProRes 4444 XQ), Sony (XAVC / RAW / S-Log3), Canon Cinema RAW Light (CRM / C-Log), Blackmagic (BRAW), Apple ProRes RAW, and 10-bit LOG mirrorless captures. We grade in ACES 1.3 or DaVinci YRGB Color Managed color science."
          }
        },
        {
          "@type": "Question",
          "name": "What is your standard turnaround time for a first cut?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Standard commercial short-form edits (0:15 / 0:30 / 0:60 / 9:16 reels) deliver an initial assembly / offline rough cut within 48 to 72 business hours. Music videos, documentaries, and long-form brand films typically deliver in 5 to 7 business days. Rush priority delivery (24-hour turnaround) is available upon request."
          }
        },
        {
          "@type": "Question",
          "name": "Do you execute Non-Disclosure Agreements (NDAs) for unreleased campaigns?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We sign mutual or client-drafted NDAs before accepting any project drive, script, or footage link. Unreleased creative campaigns, product launches, and narrative projects remain strictly air-gapped on encrypted local RAID storage until their official public broadcast."
          }
        }
      ]
    }
    </script>
